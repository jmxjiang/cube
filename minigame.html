<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jmx-jiang</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="imgs/logo.png" />
  </head>
  <body class="flex-start">
    <div class="minigame-computer"></div>
    <div class="enemies"></div>
    <div id="final">
      <p id="score">Score: </p>
      <p id="high-score">High Score: </p>
      <p class="time">Survived: </p>
      <button type="button" id="continue" onclick="window.location.reload()">Continue</button>
    </div>
    <p class="time"></p>
    <div class="mobile-controls">
      <div></div>
      <button id="w"><img src="imgs/up.png" alt="up arrow" width="70vw" /></button>
      <div></div>
      <button id="a"><img src="imgs/left.png" alt="left arrow" width="70vw" /></button>
      <div></div>
      <button id="d"><img src="imgs/right.png" alt="right arrow" width="70vw" /></button>
      <div></div>
      <button id="s"><img src="imgs/bottom.png" alt="bottom arrow" width="70vw" /></button>
      <div></div>
    </div>
    <div class="ray"></div>
    <div class="laser"></div>
    <p class="text hidden">i see you</p>
    <button type="button" class="hidden" id="next">Next</button>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
      if ((localStorage.getItem('joystick') ?? 'ON') === 'OFF') $('.mobile-controls').hide();
    </script>
    <script src="js/main.js"></script>
    <script src="js/nav.js"></script>
  </body>
</html>
