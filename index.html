<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jmx-jiang</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="imgs/logo.png" />
  </head>
  <body>
    <header>
      <h1>Cube</h1>
      <div class="minigame-computer"></div>
    </header>
    <div class="enemies"></div>
    <dialog id="settings">
      <div id="settings-header">
        <h2>Settings</h2>
        <button type="button" onclick="document.getElementById('settings').close();"><img src="imgs/x.svg" alt="exit out settings" width="20" /></button>
      </div>
      <button onclick="toggle(this);">Show joystick: <span class="setting" id="joystick"></span></button>
    </dialog>
    <button type="button" class="main"><a href="minigame.html">Play</a></button>
    <button type="button" class="main" onclick="document.getElementById('settings').showModal();">
      Settings
    </button>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/nav.js"></script>
    <script>
      $('.setting').each(function() {
        const el = $(this);
        el.html(localStorage.getItem(el.attr('id')) ?? 'ON');
      });
      
      function toggle(el) {
        el = $(el);
        const span = el.children('span').first();
        const id = span.attr('id');
        localStorage.setItem(id, localStorage.getItem(id) === 'OFF' ? 'ON' : 'OFF')
        span.html(localStorage.getItem(id));
      }
    </script>
  </body>
</html>
